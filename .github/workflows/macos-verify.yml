name: macOS Build and Smoke Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run smoke tests
        run: scripts/verify.sh
